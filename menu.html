<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaBeans Café - Menú</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f1e8;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .producto {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .producto img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .producto h2 {
            margin-bottom: 10px;
        }

        .categoria {
            font-size: 14px;
            color: #777;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h1>JavaBeans Café</h1>

    <div class="menu">
<div class="producto"><img src="imagenes/fondo.png" alt="Cafe Latte"><h2>Cafe Latte</h2><p class="categoria">BEBIDA_CALIENTE</p><p class="precio">Q25,00</p></div><div class="producto"><img src="imagenes/cafe.png" alt="Cafe simple"><h2>Cafe simple</h2><p class="categoria">BEBIDA_CALIENTE</p><p class="precio">Q40,00</p></div><div class="producto"><img src="imagenes/Prueba.png" alt="Cafe Latte con cremora"><h2>Cafe Latte con cremora</h2><p class="categoria">BEBIDA_CALIENTE</p><p class="precio">Q25,00</p></div><div class="producto"><img src="https://images.unsplash.com/photo-1572449043416-55f4685c9bb7?q=80&w=1000&auto=format&fit=crop" alt="cafe azucarado"><h2>cafe azucarado</h2><p class="categoria">BEBIDA_CALIENTE</p><p class="precio">Q50,00</p></div>    </div>

</body>
</html>
